# Athlete-specific parameters — single source of truth for all models.
# Values estimated from the Strava export (October 2023 to June 2026).

athlete:
  name: "Emmanouil Vichos"

thresholds:
  lthr_bpm: 173              # lactate threshold heart rate (running)
  run_threshold_pace: "3:53" # min/km at threshold
  bike_ftp_watts: 260        # functional threshold power
  # HR reads lower for the same effort in cycling (~5-8 bpm) and swimming
  # (~8-10 bpm) than running; sport-specific LTHRs for intensity bucketing.
  lthr_by_sport:
    run: 173
    bike: 166
    swim: 164

heart_rate:
  hr_max_bpm: 195            # maximum heart rate (adjust to measured value)
  hr_rest_bpm: 50            # resting heart rate (adjust to measured value)

constraints:
  weekly_hours_max: 12.0     # baseline ceiling; sensitivity: 10 / 12 / 14
  weekly_hours_min_per_discipline:
    swim: 1.0
    bike: 2.0
    run: 1.5
  # realistic ceilings (pool availability, injury risk); also bound the
  # degeneracy of alternative optimal discipline mixes
  weekly_hours_max_per_discipline:
    swim: 4.0
    bike: 6.5
    run: 5.0

banister:
  tau_ctl_days: 42           # chronic training load time constant
  tau_atl_days: 7            # acute training load time constant
  k1: 1.0                    # fitness weight in performance objective
  k2: 2.0                    # fatigue weight in performance objective

# Intensity buckets (collapsed from 7 zones for LP tractability):
# TRIMP-per-hour rates per discipline and bucket, estimated from HR data.
# easy   = Z1–Z2 (below ~85% LTHR)
# moderate = Z3 (tempo, 85–95% LTHR)
# hard   = Z4+ (threshold and above)
trimp_rates:
  swim:     {easy: 50, moderate: 75, hard: 100}
  bike:     {easy: 55, moderate: 85, hard: 115}
  run:      {easy: 65, moderate: 95, hard: 130}

macrocycle:
  weeks: 16
  phases:
    base:  {weeks: [1, 6]}
    build: {weeks: [7, 12]}
    peak:  {weeks: [13, 14]}
    taper: {weeks: [15, 16]}

# Model 2 (race-calendar MIP) parameters
model2:
  budget_eur: 2500           # season budget, entries + travel (sensitivity: 1500/2500/4000)
  max_races_per_month: 2
  recovery_weeks:            # min weeks after a race of each class before the next race
    sprint: 1
    olympic: 2
    "70.3": 4
  value_weights:             # v_i = weather_prob * (w_pts*pts + w_str*strat + w_pref*enjoyment + w_fit*suitability)
    points: 1.0
    strategic: 3.0
    preference: 2.0
    fit: 2.0
  preference_weights:        # enjoyment = weighted mix of subjective 1-10 scores
    organization: 0.3        # event logistics, aid stations, transition setup
    scenery: 0.3             # views, atmosphere
    swim_quality: 0.4        # water clarity, temperature, chop
  # suitability (0-10) is computed from OBJECTIVE course data (elevation gain
  # per km) matched against the athlete's terrain preference per leg
  terrain_preference:
    bike: flat               # flat | hilly | any
    run: flat
  weather_risk_adjust: true  # multiply race value by P(good conditions)
  vacation_days_budget: 12   # second knapsack dimension: days off work per season
  require_a_race: true       # at least one championship-quality target per season
  ctl_required:              # projected CTL needed to be race-ready per class
    sprint: 60
    olympic: 75
    "70.3": 90
  # season CTL projection (Model 1 -> Model 2 link): off-season start,
  # then load ramps at ramp_max toward Model 1's build-phase average load
  offseason_ctl: 60
  offseason_weekly_load: 400
  sustained_weekly_load: 770  # avg build-phase TRIMP from Model 1 optimal plan

# Model 3 (race-pacing LP) parameters
model3:
  distances_km: {swim: 1.5, bike: 40.0, run: 10.0}   # Olympic distance
  transitions_min: {t1: 2.0, t2: 1.5}
  swim_threshold_pace_per_100m: "1:40"               # threshold swim speed
  bike_speed_at_ftp_kmh: 35.0                        # solo non-draft speed on a FLAT course
  # Hilly courses: the reference speed is scaled by a factor derived from the
  # cycling power balance (see model3_pacing.grade_factor) -- nothing is fitted
  # to race results. These two constants are the only extra inputs.
  system_mass_kg: 78.0            # rider + bike + kit
  rolling_resistance_coeff: 0.004 # road tyres on tarmac
  # The baseline Olympic instance below is a FLAT reference course (G = 0);
  # each validation race supplies its own measured climbing per km.
  bike_metabolic_efficiency: 0.24                    # mechanical/metabolic ratio
  run_energy_cost_kj_per_km: 293                     # ~1 kcal/kg/km at 70 kg
  swim_energy_cost_kj_per_km: 1170                   # ~4x running cost per km
  # zone intensity as fraction of threshold (power for bike, speed for swim/run);
  # bike speed scales with cube root of power
  power_fraction:      {Z1: 0.55, Z2: 0.75, Z3: 0.90, Z4: 1.00, Z5: 1.06}
  swim_speed_fraction: {Z1: 0.75, Z2: 0.85, Z3: 0.92, Z4: 1.00, Z5: 1.04}
  run_speed_fraction:  {Z1: 0.72, Z2: 0.82, Z3: 0.90, Z4: 1.00, Z5: 1.05}
  # economy degrades with intensity (anaerobic contribution): cost/km multiplier
  intensity_cost_factor: {Z1: 0.95, Z2: 1.00, Z3: 1.05, Z4: 1.12, Z5: 1.20}
  # E_tot = k_E * CTL(race day); calibrated so an all-threshold race is
  # just out of reach, forcing genuine pacing decisions
  energy_budget_kj_per_ctl: 115
  max_hard_fraction: {swim: 0.40, bike: 0.50, run: 0.50}  # Z4+Z5 share of leg time
  # bike->run fatigue coupling: km of run coverage lost per kJ of Z4+ bike work
  bike_run_coupling_km_per_kj: 0.0005
  # --- pipeline coherence (see src/analysis/coherence.py) ---
  # Form-based energy budget: E = energy_base_kj + k_E*(CTL - lambda*ATL).
  # Coherence with Model 1 requires lambda = k2/k1; positivity requires
  # lambda < CTL_T/ATL_T ~ 1.75. k2 = 1.5 satisfies both and lies inside the
  # cost-ranging stability interval [1.29, 2.95], so the optimal plan is
  # unchanged. Default 0.0 keeps the validated fitness-only budget.
  fatigue_lambda: 0.0
  energy_base_kj: 0.0
  # in-race carbohydrate intake (kJ/min), reduces net energy drain per zone.
  # 0 for short races (baseline); ~21 (= ~75 g carbs/h, standard guideline)
  # for long-course -- calibrated & validated on the athlete's 70.3 (Oct 2025)
  in_race_fueling_kj_per_min: 0.0
  # per-leg gut absorption ceilings (kJ/min) when fueling is a DECISION
  # variable: F_l <= r_max_l * leg_time. Cannot eat while swimming; upright
  # stable stomach on the bike absorbs most; running jostling limits intake.
  fueling_max_kj_per_min:
    swim: 0.0
    bike: 25.0
    run: 15.0

# Model 1 (training-load LP) parameters
model1:
  atl_max: 110               # fatigue ceiling (current ATL ~91; sensitivity: 100/110/125)
  polarization_max: 0.20     # max fraction of weekly hours at moderate+hard (80/20 rule)
  ramp_max: 0.10             # max weekly TRIMP load increase (10%)
  hours_multiplier:          # phase-dependent fraction of weekly_hours_max
    base: 0.90
    build: 1.00
    peak: 1.00
    taper: 0.65
  taper_load_fraction:       # taper-week TRIMP cap vs. average build-phase load
    15: 0.60
    16: 0.40
